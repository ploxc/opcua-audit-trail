[package]
name = "opcua-audit-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transparent OPC UA gateway that records an audit trail of every write, method call and client session."
repository = "https://github.com/harted/opcua-audit-trail"

[[bin]]
name = "opcua-audit-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
argon2 = "0.5"
async-opcua = { version = "0.19", features = ["client"] }
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
parking_lot = "0.12"
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
async-opcua = { version = "0.19", features = ["client", "server"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }

# Optimise dependencies in dev/test builds: RSA key generation and
# encryption are unbearably slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
