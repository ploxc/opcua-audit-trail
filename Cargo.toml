[package]
name = "opcua-audit-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transparent OPC UA gateway that records an audit trail of every write, method call and client session."
repository = "https://github.com/harted/opcua-audit-trail"

[[bin]]
name = "opcua-audit-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-opcua = { version = "0.19", features = ["client"] }
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-opcua = { version = "0.19", features = ["client", "server"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
