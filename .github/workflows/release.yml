name: Release

# Push a tag like v0.2.0 to publish binaries and container images. A manual
# run on a branch is a dry run (build only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the jobs that publish get write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-linux-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          cp packaging/linux/* "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "opcua-audit-gateway-$version-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/opcua-audit-gateway.exe, README.md, ARCHITECTURE.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: "*.zip"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-macos-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Arrange binaries per platform
        run: |
          mkdir -p docker-dist/data
          for arch in amd64 arm64 armv7; do
            mkdir -p docker-dist/linux-$arch
            tar xzf dist/*-linux-$arch.tar.gz -C docker-dist/linux-$arch --strip-components=1
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
