name: Release

# Push a tag like v0.2.0 to publish binaries and container images.
# Changes to the release files themselves trigger a dry run (build only).
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - Dockerfile.release
      - packaging/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-linux-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          cp packaging/linux/* "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "opcua-audit-gateway-$version-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/opcua-audit-gateway.exe, README.md, ARCHITECTURE.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: "*.zip"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-macos-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Arrange binaries per platform
        run: |
          mkdir -p docker-dist/data
          for arch in amd64 arm64 armv7; do
            mkdir -p docker-dist/linux-$arch
            tar xzf dist/*-linux-$arch.tar.gz -C docker-dist/linux-$arch --strip-components=1
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
