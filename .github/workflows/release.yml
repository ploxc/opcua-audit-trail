name: Release

# Push a tag like v0.2.0 to publish binaries and container images. A manual
# run on a branch is a dry run (build only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the jobs that publish get write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-linux-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          cp packaging/linux/* "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "opcua-audit-gateway-$version-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/opcua-audit-gateway.exe, README.md, ARCHITECTURE.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: "*.zip"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-macos-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md ARCHITECTURE.md LICENSE "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # The compose example that runs the published image.
      - run: cp docker/compose/docker-compose.yml dist/docker-compose.yml
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # Above the generated notes. The macOS binaries are not signed.
          body: |
            ### macOS

            The binaries are not signed or notarized: after unpacking, remove
            the quarantine flag and make the file executable.

            ```sh
            tar xzf opcua-audit-gateway-*-macos-arm64.tar.gz && cd opcua-audit-gateway-*
            xattr -d com.apple.quarantine opcua-audit-gateway   # "No such xattr" is fine
            chmod +x opcua-audit-gateway
            ```

            Use the `x86_64` archive on an Intel Mac.

            ### Docker

            Download `docker-compose.yml` from the assets below, then:

            ```sh
            docker compose up -d
            docker compose cp gateway:/data/initial-admin-password.txt .   # first login
            ```

            The web UI is on http://127.0.0.1:8080. The image is
            `ghcr.io/ploxc/opcua-audit-trail` (linux/amd64, arm64, arm/v7).

            Checksums are in `SHA256SUMS`.

  image:
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Arrange binaries per platform
        run: |
          mkdir -p docker-dist/data
          for arch in amd64 arm64 armv7; do
            mkdir -p docker-dist/linux-$arch
            tar xzf dist/*-linux-$arch.tar.gz -C docker-dist/linux-$arch --strip-components=1
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No .dockerbuild build record in the artifacts; the job summary stays.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
