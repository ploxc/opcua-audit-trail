name: Release

# Push a tag like v0.2.0 to publish binaries and container images. A manual
# run on a branch is a dry run (build only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the jobs that publish get write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, arch: arm64 }
          - { target: armv7-unknown-linux-musleabihf, arch: armv7 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-linux-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md CHANGELOG.md ARCHITECTURE.md LICENSE "$name"/
          mkdir -p "$name/docs" && cp -r docs/manual "$name/docs/"
          cp packaging/linux/* "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '/', '-'
          $name = "opcua-audit-gateway-$version-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/opcua-audit-gateway.exe, README.md, CHANGELOG.md, ARCHITECTURE.md, LICENSE $name
          New-Item -ItemType Directory "$name/docs" | Out-Null; Copy-Item -Recurse docs/manual "$name/docs/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: "*.zip"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name=opcua-audit-gateway-$version-macos-${{ matrix.arch }}
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/opcua-audit-gateway README.md CHANGELOG.md ARCHITECTURE.md LICENSE "$name"/
          mkdir -p "$name/docs" && cp -r docs/manual "$name/docs/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: "*.tar.gz"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # The compose example that runs the published image.
      - run: cp docker-compose.yml dist/docker-compose.yml
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          # The notes are in CHANGELOG.md, written and reviewed before the tag.
          body: |
            What changed: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            Installation: the [manual](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/manual/README.md)
            (Docker: download `docker-compose.yml` below, then `docker compose up -d`).
            The image is `ghcr.io/${{ github.repository }}` (linux/amd64, arm64, arm/v7).
            Checksums are in `SHA256SUMS`.

  image:
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Arrange binaries per platform
        run: |
          mkdir -p docker-dist/data
          for arch in amd64 arm64 armv7; do
            mkdir -p docker-dist/linux-$arch
            tar xzf dist/*-linux-$arch.tar.gz -C docker-dist/linux-$arch --strip-components=1
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # A multi-arch image shows its description on the package page
          # from the index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          # Shown on the package page (at most 512 characters), above the
          # repository's README, which GitHub shows for a linked package.
          labels: |
            org.opencontainers.image.description=Docker image of the OPC UA Audit Gateway: a transparent OPC UA gateway that records who writes what, when. Start it with the docker-compose.yml from the release (ports, volume, HTTPS): docker compose up -d, then docker compose logs gateway for the first admin password. Manual: https://github.com/ploxc/opcua-audit-trail/tree/main/docs/manual
          annotations: |
            org.opencontainers.image.description=Docker image of the OPC UA Audit Gateway: a transparent OPC UA gateway that records who writes what, when. Start it with the docker-compose.yml from the release (ports, volume, HTTPS): docker compose up -d, then docker compose logs gateway for the first admin password. Manual: https://github.com/ploxc/opcua-audit-trail/tree/main/docs/manual
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No .dockerbuild build record in the artifacts; the job summary stays.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
