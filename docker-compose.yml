# From a checkout: uses the published image, or builds it from this
# directory when it cannot be pulled (`docker compose build` forces a local
# build). Without a checkout, use docker/compose/docker-compose.yml.
services:
  gateway:
    image: ghcr.io/ploxc/opcua-audit-trail:latest
    build: .
    restart: unless-stopped
    ports:
      # Web UI: loopback only (plain HTTP); use a TLS proxy for remote access.
      - "127.0.0.1:8080:8080"
      # One port per target (OPC UA clients connect here).
      - "4841:4841"
    # Config, certificates, users and the audit trail live in /data. On the
    # first start /data/config.toml is created from docker/config.toml (baked
    # into the image). Targets are managed in the web UI; to edit other
    # settings: docker compose cp gateway:/data/config.toml . (edit),
    # docker compose cp config.toml gateway:/data/config.toml, restart.
    volumes:
      - gateway-data:/data

volumes:
  gateway-data:
