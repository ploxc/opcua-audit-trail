# Default configuration inside the container image.
# Mount your own file over /etc/opcua-audit-gateway/config.toml to change it.

[gateway]
application_name = "OPC UA Audit Gateway"
pki_dir = "/data/pki"
data_dir = "/data"
# The container cannot see the host's name or IP: list what clients use.
# certificate_hostnames = ["gateway.local", "192.168.0.20"]

[web]
# The web UI has no login yet: publish this port on the host's loopback only
# (see docker-compose.yml).
listen = "0.0.0.0:8080"

[audit]
retention_days = 365
fail_mode = "open"
record_old_value = true

