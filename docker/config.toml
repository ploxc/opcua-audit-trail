# Template for /data/config.toml: copied there on the container's first start.
# After that, /data/config.toml is the live configuration (targets can be
# managed in the web UI).

[gateway]
application_name = "OPC UA Audit Gateway"
pki_dir = "/data/pki"
data_dir = "/data"
# Fixed: the default contains the host name, which is a new random container
# ID after every `docker compose up` that recreates the container. The
# certificate would then no longer match and PLCs refuse it
# (BadCertificateUriInvalid).
application_uri = "urn:opcua-audit-gateway:docker"
# The container cannot see the host's name or IP: list what clients use.
# certificate_hostnames = ["gateway.local", "192.168.0.20"]

[web]
# HTTPS is set by OPCUA_GATEWAY_WEB_TLS (docker-compose.yml, on by default)
# and uses the gateway certificate: browsers ask once to accept it. Use your
# own (e.g. from the plant CA) with tls_certificate / tls_private_key.
listen = "0.0.0.0:8080"
# tls_certificate = "/data/web-cert.pem"  # PEM chain
# tls_private_key = "/data/web-key.pem"

# The MCP endpoint for AI assistants: off until an admin turns it on
# (Settings page).
# [mcp]
# enabled = false

[audit]
retention_days = 365
# "closed": a write only reaches the PLC once its record is stored.
fail_mode = "closed"
record_old_value = true

# Copies of the audit trail outside the gateway (see README "Audit export").
# [export.questdb]
# url = "http://questdb:9000"      # your QuestDB (not included in the compose file)

